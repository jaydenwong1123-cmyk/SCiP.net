<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- SCiP-2521-A // ABYSS. A field of concentric ocelli pushed through two
       octave-stacked fractal displacements: the coarse pass tears the grid into
       whorls, the fine pass frays every edge into filament. Nothing here is a
       raster - the whole plate is generated by the filter chain, so it stays
       sharp at any screen size and costs a few KB. -->
  <defs>
    <filter id="warp" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0032 0.0055" numOctaves="5" seed="17" result="coarse"/>
      <feDisplacementMap in="SourceGraphic" in2="coarse" scale="340" xChannelSelector="R" yChannelSelector="G" result="torn"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" seed="91" result="fine"/>
      <feDisplacementMap in="torn" in2="fine" scale="26" xChannelSelector="R" yChannelSelector="B" result="frayed"/>
      <feGaussianBlur in="frayed" stdDeviation="0.5"/>
    </filter>

    <pattern id="ocelli" width="150" height="150" patternUnits="userSpaceOnUse">
      <rect width="150" height="150" fill="#01030c"/>
      <g fill="none" stroke="#6ea8ee" stroke-width="2.2" opacity="0.92">
        <circle cx="75" cy="75" r="10"/>
        <circle cx="75" cy="75" r="21"/>
        <circle cx="75" cy="75" r="33"/>
        <circle cx="75" cy="75" r="46"/>
        <circle cx="75" cy="75" r="60"/>
        <circle cx="75" cy="75" r="74"/>
      </g>
      <g fill="none" stroke="#bcd9ff" stroke-width="1.1">
        <circle cx="75" cy="75" r="15.5"/>
        <circle cx="75" cy="75" r="39"/>
        <circle cx="75" cy="75" r="67"/>
      </g>
      <circle cx="75" cy="75" r="5" fill="#e6f0ff"/>
      <circle cx="75" cy="75" r="2" fill="#0a1a33"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="#01030c"/>

  <!-- Arterial bleed, laid under the structure so the warp reads as depth
       rather than as a stain sitting on top of it. -->
  <g filter="url(#warp)" opacity="0.55">
    <rect x="-300" y="-300" width="1800" height="1400" fill="#01030c"/>
    <ellipse cx="470" cy="470" rx="150" ry="95" fill="#7d1010"/>
    <ellipse cx="770" cy="330" rx="105" ry="70" fill="#5a0c0c"/>
  </g>

  <!-- Oversized and offset so the displacement pulls structure in from beyond
       the frame instead of dragging the plate's own edges into view. -->
  <rect x="-300" y="-300" width="1800" height="1400" fill="url(#ocelli)" filter="url(#warp)" opacity="0.95"/>
</svg>
