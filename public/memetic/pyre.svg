<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- SCiP-2521-C // PYRE. The warm plate. Shorter coarse displacement and a
       heavier fine pass than the other two, which clusters the ocelli into
       lobes rather than tearing them into long whorls - the organic, wet look
       of the reference rather than the deep-field one. -->
  <defs>
    <filter id="warp" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0048 0.0062" numOctaves="5" seed="61" result="coarse"/>
      <feDisplacementMap in="SourceGraphic" in2="coarse" scale="240" xChannelSelector="R" yChannelSelector="G" result="torn"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.038" numOctaves="5" seed="23" result="fine"/>
      <feDisplacementMap in="torn" in2="fine" scale="42" xChannelSelector="R" yChannelSelector="B" result="frayed"/>
      <feGaussianBlur in="frayed" stdDeviation="0.55"/>
    </filter>

    <pattern id="lobes" width="140" height="140" patternUnits="userSpaceOnUse">
      <rect width="140" height="140" fill="#160401"/>
      <g fill="none" stroke="#c85a12" stroke-width="2.6" opacity="0.9">
        <circle cx="70" cy="70" r="11"/>
        <circle cx="70" cy="70" r="23"/>
        <circle cx="70" cy="70" r="36"/>
        <circle cx="70" cy="70" r="50"/>
        <circle cx="70" cy="70" r="65"/>
      </g>
      <g fill="none" stroke="#f2b96a" stroke-width="1.2">
        <circle cx="70" cy="70" r="17"/>
        <circle cx="70" cy="70" r="43"/>
        <circle cx="70" cy="70" r="58"/>
      </g>
      <circle cx="70" cy="70" r="5.5" fill="#ffe2ae"/>
      <circle cx="70" cy="70" r="2.2" fill="#3a0d02"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="#160401"/>

  <!-- Ember bed under the structure, so the lobes sit inside a glow instead of
       floating on flat ground. -->
  <g filter="url(#warp)" opacity="0.6">
    <rect x="-300" y="-300" width="1800" height="1400" fill="#160401"/>
    <ellipse cx="600" cy="420" rx="330" ry="215" fill="#8a2f06"/>
    <ellipse cx="380" cy="250" rx="140" ry="100" fill="#b04d0a"/>
  </g>

  <rect x="-300" y="-300" width="1800" height="1400" fill="url(#lobes)" filter="url(#warp)" opacity="0.95"/>
</svg>
